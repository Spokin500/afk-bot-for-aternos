app = "aternos-afk-bot"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "2323"

[http_service]
  internal_port = 2323
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.health_checks]]
    interval = "1m"
    timeout = "3s"
    grace_period = "10s"
    path = "/"